  name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main              # 仅在 main 分支推送时触发
    paths:
      - 'docs/**'         # docs 目录变化时触发
      - 'mkdocs.yml'      # 配置文件变化时触发
      - 'requirements.txt'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:      # 允许在 Actions 页面手动触发

# 允许工作流向 gh-pages 分支推送内容
permissions:
  contents: write

# 同一时间只保留一个部署任务，新的推送取消排队中的旧任务
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 安装MkDocs及主题
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material

      - name: 构建静态文档
        run: |
          mkdocs build   # 生成的静态文件存放在 site 目录

      - name: 部署到GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages     # 部署目标分支
          folder: site         # 待部署的文件目录
          clean: true
