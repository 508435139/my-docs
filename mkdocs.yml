site_name: 我的技术文档
site_description: 使用 MkDocs 构建并通过 GitHub Actions 自动部署到 GitHub Pages
site_author: 我的技术文档
# 这一行必须换成你自己的 Pages 地址（双引号包起来），例如：
# site_url: "https://zhongxj.github.io/my-docs/"
site_url: "https://GITHUB_USERNAME.github.io/REPO_NAME/"

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.top
    - content.code.copy

nav:
  - 首页: index.md
  - 关于: about.md
  - 指南: guide.md
  - API: api.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
